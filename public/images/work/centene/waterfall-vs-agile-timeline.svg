<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: "Outfit", system-ui, -apple-system, sans-serif; }
  </style>
  <!-- Top track — waterfall -->
  <g transform="translate(20, 60)">
    <text x="0" y="0" font-size="14" font-weight="600" letter-spacing="0.12em" fill="#68675F">WATERFALL</text>
    <text x="0" y="32" font-size="18" font-weight="300" fill="#5C5B56">One big release after a long buildup</text>
    <line x1="0" y1="78" x2="1080" y2="78" stroke="#D8DEE4" stroke-width="3" stroke-dasharray="8 8" />
    <circle cx="1080" cy="78" r="16" fill="#68675F" />
    <text x="1080" y="118" text-anchor="middle" font-size="15" fill="#68675F">v1.0</text>
  </g>
  <!-- Bottom track — agile -->
  <g transform="translate(20, 240)">
    <text x="0" y="0" font-size="14" font-weight="600" letter-spacing="0.12em" fill="#7E5071">AGILE</text>
    <text x="0" y="32" font-size="18" font-weight="300" fill="#5C5B56">Continuous, incremental wins</text>
    <line x1="0" y1="78" x2="1080" y2="78" stroke="#7E5071" stroke-width="3" />
    <g fill="#7E5071">
      <circle cx="0" cy="78" r="9" />
      <circle cx="183" cy="78" r="9" />
      <circle cx="367" cy="78" r="9" />
      <circle cx="550" cy="78" r="9" />
      <circle cx="733" cy="78" r="9" />
      <circle cx="917" cy="78" r="9" />
      <circle cx="1080" cy="78" r="16" />
    </g>
    <g font-size="14" fill="#5C5B56" text-anchor="middle">
      <text x="0" y="118">v0.1</text>
      <text x="183" y="118">v0.2</text>
      <text x="367" y="118">v0.3</text>
      <text x="550" y="118">v0.4</text>
      <text x="733" y="118">v0.5</text>
      <text x="917" y="118">v0.6</text>
    </g>
    <text x="1080" y="118" text-anchor="middle" font-size="15" fill="#7E5071">v1.0</text>
  </g>
</svg>
