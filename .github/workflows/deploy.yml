name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Absolute canonical, Open Graph and sitemap URLs. Without it the build
          # skips the sitemap and emits relative og:image paths, which link
          # previews cannot resolve. A local build that needs to match production
          # passes it the same way: VITE_SITE_URL=https://mathiscertenais.com pnpm build
          VITE_SITE_URL: https://mathiscertenais.com

          # Delivers the contact form. The access key is public by design, but it
          # is read from a secret so a rotation does not need a commit: without it
          # the form degrades to a prefilled email draft.
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
