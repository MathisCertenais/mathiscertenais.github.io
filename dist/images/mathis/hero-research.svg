<svg xmlns="http://www.w3.org/2000/svg" width="866" height="948" viewBox="0 0 866 948" role="img" aria-labelledby="title desc">
  <title id="title">Scientific computing network</title>
  <desc id="desc">An abstract scientific workflow connects instruments, data, high-performance computing, and research results.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="60" x2="790" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7F9"/>
      <stop offset="0.58" stop-color="#E4EBF1"/>
      <stop offset="1" stop-color="#D7E0E9"/>
    </linearGradient>
    <linearGradient id="orb" x1="260" y1="260" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7E5071"/>
      <stop offset="1" stop-color="#4E6FA3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#18283C" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4E6FA3" stroke-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="866" height="948" rx="44" fill="url(#bg)"/>
  <rect x="28" y="28" width="810" height="892" rx="28" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity="0.7"/>
  <circle cx="433" cy="474" r="360" fill="url(#glow)" opacity="0.75"/>

