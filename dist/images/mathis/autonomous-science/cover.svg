<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Autonomous Science and Agentic AI</title>
  <desc id="cover-desc">A task board with dependent task cards feeds a single human signature, which unlocks an execution plan mapped to the TGCC, IDRIS and CINES supercomputers.</desc>

  <rect width="1200" height="630" fill="#eef2f5"/>
  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="#d8dde2" stroke-width="2"/>

  <text x="60" y="84" font-family="Georgia, 'Libre Baskerville', serif" font-size="38" fill="#15181c">Autonomous Science and Agentic AI</text>
  <text x="60" y="116" font-family="Outfit, system-ui, sans-serif" font-size="16" fill="#7e5071" letter-spacing="0.14em">THE AGENT PLANS, THE SCIENTIST SIGNS</text>

  <!-- 01 task board -->
  <text x="60" y="176" font-family="Outfit, system-ui, sans-serif" font-size="13" fill="#7e5071" letter-spacing="0.14em">01 · TASK BOARD</text>
  <rect x="60" y="192" width="300" height="310" rx="14" fill="#ffffff" stroke="#d8dde2"/>

  <rect x="84" y="216" width="118" height="54" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="96" y="239" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15181c">T1 · input</text>
  <text x="96" y="256" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">stage data</text>

  <rect x="238" y="216" width="98" height="54" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="250" y="239" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15181c">T2 · run</text>
  <text x="250" y="256" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">TGCC</text>

  <rect x="84" y="312" width="118" height="54" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="96" y="335" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15181c">T3 · move</text>
  <text x="96" y="352" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">CCFR → IDRIS</text>

  <rect x="238" y="312" width="98" height="54" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="250" y="335" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15181c">T4 · run</text>
  <text x="250" y="352" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">IDRIS</text>

  <rect x="84" y="408" width="252" height="54" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="96" y="431" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15181c">T5 · run</text>
  <text x="96" y="448" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">CINES · fetch products</text>

  <path d="M202 243 H226" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M226 243 l-7 -4 v8 z" fill="#7e5071"/>
  <path d="M143 270 V300" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M143 300 l-4 -7 h8 z" fill="#7e5071"/>
  <path d="M202 339 H226" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M226 339 l-7 -4 v8 z" fill="#7e5071"/>
  <path d="M143 366 V396" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M143 396 l-4 -7 h8 z" fill="#7e5071"/>
  <path d="M210 462 V480" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M210 480 l-4 -7 h8 z" fill="#7e5071"/>

  <!-- 02 signature -->
  <text x="420" y="176" font-family="Outfit, system-ui, sans-serif" font-size="13" fill="#7e5071" letter-spacing="0.14em">02 · SIGNATURE</text>
  <rect x="420" y="192" width="300" height="310" rx="14" fill="#ffffff" stroke="#d8dde2"/>
  <text x="444" y="236" font-family="Outfit, system-ui, sans-serif" font-size="14" fill="#5b6470">one signature, whole plan</text>
  <rect x="444" y="258" width="252" height="54" rx="8" fill="#eef2f5" stroke="#d8dde2"/>
  <text x="460" y="282" font-family="Outfit, system-ui, sans-serif" font-size="12" fill="#5b6470">payload sha256</text>
  <text x="460" y="300" font-family="monospace" font-size="12" fill="#15181c">08c81a9d…</text>
  <rect x="444" y="330" width="252" height="54" rx="8" fill="#eef2f5" stroke="#d8dde2"/>
  <text x="460" y="354" font-family="Outfit, system-ui, sans-serif" font-size="12" fill="#5b6470">typed by a human</text>
  <text x="460" y="372" font-family="monospace" font-size="12" fill="#15181c">approve 08c81a9d</text>
  <circle cx="470" cy="424" r="16" fill="#e7f0e7" stroke="#4f7a4f"/>
  <path d="M462 424 l6 6 12 -14" stroke="#4f7a4f" stroke-width="3" fill="none"/>
  <text x="496" y="429" font-family="Outfit, system-ui, sans-serif" font-size="13" fill="#15181c">responsibility transferred</text>
  <text x="444" y="466" font-family="Outfit, system-ui, sans-serif" font-size="12" fill="#5b6470">PPST · ZRR · named person</text>

  <path d="M360 347 H408" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M408 347 l-7 -4 v8 z" fill="#7e5071"/>

  <!-- 03 execution -->
  <text x="780" y="176" font-family="Outfit, system-ui, sans-serif" font-size="13" fill="#7e5071" letter-spacing="0.14em">03 · EXECUTION PLAN</text>
  <rect x="780" y="192" width="360" height="310" rx="14" fill="#ffffff" stroke="#d8dde2"/>
  <text x="804" y="236" font-family="Outfit, system-ui, sans-serif" font-size="14" fill="#5b6470">task → centre → scheduler</text>

  <rect x="804" y="258" width="312" height="56" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="820" y="282" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#15181c">TGCC · Irene</text>
  <text x="820" y="300" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">ccc_msub · job 6114432</text>

  <rect x="804" y="326" width="312" height="56" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="820" y="350" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#15181c">IDRIS · Jean Zay</text>
  <text x="820" y="368" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">sbatch · job 1749730</text>

  <rect x="804" y="394" width="312" height="56" rx="8" fill="#f6f1f4" stroke="#c9a9bd"/>
  <text x="820" y="418" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#15181c">CINES · Adastra</text>
  <text x="820" y="436" font-family="Outfit, system-ui, sans-serif" font-size="11" fill="#5b6470">sbatch · job 5804601</text>

  <text x="804" y="478" font-family="Outfit, system-ui, sans-serif" font-size="12" fill="#5b6470">one SIESTA run · three centres</text>

  <path d="M720 347 H768" stroke="#7e5071" stroke-width="2" fill="none"/>
  <path d="M768 347 l-7 -4 v8 z" fill="#7e5071"/>

  <text x="60" y="560" font-family="Outfit, system-ui, sans-serif" font-size="13" fill="#5b6470">EOSC · local clusters · French supercomputers</text>
  <text x="60" y="584" font-family="Outfit, system-ui, sans-serif" font-size="12" fill="#7e5071">The last mile of autonomous science is a signature.</text>
</svg>
