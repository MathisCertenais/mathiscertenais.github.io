  <g fill="#7E5071" stroke="#F5F7F9" stroke-width="6"><circle cx="745" cy="232" r="15"/><circle cx="1047" cy="163" r="15"/><circle cx="1090" cy="420" r="15"/><circle cx="799" cy="466" r="15"/></g>
