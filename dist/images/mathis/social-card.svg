<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mathis Certenais — HPC and scientific workflows</title>
  <desc id="desc">A branded social sharing card with an abstract network linking scientific instruments, data, and compute.</desc>
  <defs>
    <linearGradient id="bg" x1="35" y1="18" x2="1160" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F6F8"/><stop offset="1" stop-color="#DCE5EC"/></linearGradient>
    <linearGradient id="orb" x1="760" y1="100" x2="1100" y2="550" gradientUnits="userSpaceOnUse"><stop stop-color="#7E5071"/><stop offset="1" stop-color="#4E6FA3"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17243B" flood-opacity="0.18"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#4E6FA3" stroke-opacity="0.09"/></pattern>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity="0.7"/>
  <text x="74" y="112" fill="#7E5071" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="750" letter-spacing="5">SCIENTIFIC COMPUTING</text>
  <text x="72" y="248" fill="#17243B" font-family="Georgia, serif" font-size="76" font-weight="700">Mathis</text>
  <text x="72" y="337" fill="#17243B" font-family="Georgia, serif" font-size="76" font-weight="700">Certenais.</text>
  <path d="M74 362H478" stroke="#D8B9CC" stroke-width="18"/>
  <text x="76" y="430" fill="#4D5E72" font-family="system-ui, -apple-system, sans-serif" font-size="32">HPC &amp; scientific workflows</text>
  <text x="76" y="483" fill="#667589" font-family="system-ui, -apple-system, sans-serif" font-size="26">Infrastructure that turns data into discovery.</text>

  <g fill="none" stroke-linecap="round">
